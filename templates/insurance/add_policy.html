<!-- templates/insurance/add_policy.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Insurance Policy</title>
    <link rel="stylesheet" href="/static/css/style.css?v=4">
    <script src="/static/js/backup.js?v=2"></script>
    <style>
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .module-selector {
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }
        .module-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .module-link:hover {
            color: var(--text-primary);
        }
        .module-link.active {
            color: var(--text-primary);
            background: var(--accent-blue);
            box-shadow: 0 2px 8px 0 rgba(59, 130, 246, 0.3);
        }
        .form-section-title {
            font-size: 16px;
            font-weight: 700;
            color: #60a5fa;
            margin: 32px 0 16px 0;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; flex-direction: column; align-items: stretch; gap: 20px;">
            <div class="header-top">
                <h1>Family Office Dashboard</h1>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <!-- Backup DB Button -->
                    <button onclick="triggerDumpBackup()" id="backup-db-btn" class="btn" style="padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: 1px solid rgba(16, 185, 129, 0.3); color: white; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s ease;">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"></path>
                        </svg>
                        <span id="backup-btn-text">Backup Database</span>
                    </button>
                    <div class="module-selector">
                        <a href="/mutual-funds/" class="module-link">Mutual Funds</a>
                        <a href="/equities/" class="module-link">Equities</a>
                        <a href="/insurance/" class="module-link active">Insurance</a>
                        <a href="/alternatives/unlisted/" class="module-link">Unlisted Shares</a>
                        <a href="/alternatives/aif/" class="module-link">AIF / PMS</a>
                        <a href="/gold/" class="module-link">Gold (SGB)</a>
                    </div>
                </div>
            </div>
            <div class="nav-tabs" style="justify-content: space-between; align-items: center; width: 100%; padding-right: 12px; box-sizing: border-box;">
                <div style="display: flex; gap: 8px;">
                    <a href="/insurance/" class="nav-link">&larr; Cancel and Back</a>
                    <a href="#" class="nav-link active">New Policy Form</a>
                </div>
            </div>
        </header>

        <!-- Form Card Container -->
        <div class="glass-card" style="padding: 32px;">
            <h2 style="font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 24px; color: var(--text-primary);">
                Create New Insurance Policy Record
            </h2>
            <form method="post" action="/insurance/add">
                
                <!-- 1. IDENTIFICATION SECTION -->
                <div class="form-section-title" style="margin-top: 0;">Policy Identification</div>
                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">File Number / Reference</label>
                        <input name="file_number" class="form-control" placeholder="e.g. F-123">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Policy Number</label>
                        <input name="policy_number" class="form-control" required placeholder="Unique Policy Number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Name of Insured (Owner)</label>
                        <select name="insured_person_id" class="form-control" required>
                            <option value="">— Select Insured Person —</option>
                            {% for p in persons %}
                                <option value="{{ p.id }}">{{ p.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Name of Policy Holder</label>
                        <select name="holder_person_id" class="form-control" required>
                            <option value="">— Select Holder Person —</option>
                            {% for p in persons %}
                                <option value="{{ p.id }}">{{ p.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- 2. POLICY DETAILS SECTION -->
                <div class="form-section-title">Insurer & Plan Details</div>
                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Insurer Provider</label>
                        <select name="insurer_name" class="form-control" required>
                            <option value="">— Select Insurance Provider —</option>
                            {% for i in insurers %}
                                <option value="{{ i }}">{{ i }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Plan / Option Name</label>
                        <input name="plan_name" class="form-control" placeholder="e.g. Jeevan Anand, Smart Elite">
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Insurance Class Category</label>
                        <select name="insurance_type" class="form-control" required>
                            {% for t in insurance_types %}
                                <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Sum Assured Amount (₹)</label>
                        <input name="sum_assured" type="number" step="0.01" class="form-control" placeholder="0.00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Fund Investment Name (For ULIPs)</label>
                        <input name="fund_name" class="form-control" placeholder="e.g. Bluechip Growth Fund">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Fund Type Description</label>
                        <input name="fund_type" class="form-control" placeholder="e.g. 100% Equity, Balanced, Debt">
                    </div>
                </div>

                <!-- 3. FINANCIALS SECTION -->
                <div class="form-section-title">Premiums & Schedule</div>
                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Premium Amount / Year (₹)</label>
                        <input name="premium_amount" type="number" step="0.01" class="form-control" placeholder="0.00">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Premium Pay Frequency</label>
                        <select name="premium_frequency" class="form-control">
                            <option value="ANNUAL">ANNUAL (YEARLY)</option>
                            <option value="HALF_YEARLY">HALF YEARLY</option>
                            <option value="QUARTERLY">QUARTERLY</option>
                            <option value="MONTHLY">MONTHLY</option>
                            <option value="SINGLE">SINGLE PREMIUM</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Premium Pay Term (Years)</label>
                        <input name="premium_term" type="number" class="form-control" placeholder="e.g. 10">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Payment Method Mode</label>
                        <select name="payment_method" class="form-control">
                            {% for m in payment_methods %}
                                <option value="{{ m }}">{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Lapse Threshold (Missed Premiums)</label>
                        <input name="lapse_after_missed_payments" type="number" class="form-control" value="2">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Policy Status</label>
                        <select name="status" class="form-control">
                            {% for s in statuses %}
                                <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Policy Commencement Date</label>
                        <input name="policy_start_date" type="date" class="form-control" required>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Policy Maturity End Date</label>
                        <input name="policy_end_date" type="date" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="field-group">
                        <label class="field-label">Maturity Return Value (₹)</label>
                        <input name="maturity_amount" type="number" step="0.01" class="form-control" placeholder="0.00">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Broker / Agent Representative</label>
                        <input name="agent_name" class="form-control" placeholder="Agent Representative Name">
                    </div>
                </div>

                <div class="field-group" style="margin-bottom: 24px;">
                    <label class="field-label">Policy Description Notes</label>
                    <textarea name="notes" rows="3" class="form-control" placeholder="Enter policy notes, term exclusions, or comments..."></textarea>
                </div>

                <button type="submit" class="btn-primary" style="padding: 14px 28px; font-size: 15px; font-weight: 700; width: 100%; justify-content: center; border-radius: 10px;">
                    Save Insurance Policy Record
                </button>
            </form>
        </div>
    </div>
</body>
</html>
